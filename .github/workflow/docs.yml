# Docs：发布 docs/ 落地页到 GitHub Pages。
#
# 仓库设置：Settings → Pages → Source 选 GitHub Actions。
# 发布内容仅包含落地页所需静态文件，不含内部设计/检查清单。

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/image.png"
      - "docs/image-black.png"
      - "docs/launcher-mark.svg"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage public docs
        run: |
          mkdir -p site
          cp docs/index.html docs/image.png docs/image-black.png docs/launcher-mark.svg site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
