<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deepseek-harness-launcher · 插件市场设置原型</title>
  <style>
    :root {
      color-scheme: dark;
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 10% 3.9%;
      --card-foreground: 0 0% 98%;
      --popover: 240 10% 3.9%;
      --popover-foreground: 0 0% 98%;
      --primary: 0 0% 98%;
      --primary-foreground: 240 5.9% 10%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 3.7% 15.9%;
      --muted-foreground: 240 5% 64.9%;
      --accent: 240 3.7% 15.9%;
      --accent-foreground: 0 0% 98%;
      --destructive: 0 62.8% 30.6%;
      --destructive-foreground: 0 0% 98%;
      --success: 142 71% 45%;
      --warning: 38 92% 50%;
      --border: 240 3.7% 15.9%;
      --input: 240 3.7% 15.9%;
      --ring: 240 4.9% 83.9%;
      --canvas: hsl(var(--background));
      --window: hsl(var(--background));
      --surface: hsl(var(--secondary));
      --surface-hover: hsl(240 3.7% 20%);
      --surface-strong: hsl(240 3.7% 25%);
      --text: hsl(var(--foreground));
      --text-muted: hsl(var(--muted-foreground));
      --text-faint: hsl(240 4% 54%);
      --line: hsl(var(--border));
      --control-primary: hsl(var(--primary));
      --control-primary-foreground: hsl(var(--primary-foreground));
      --accent-soft: hsl(var(--accent));
      --accent-soft-foreground: hsl(var(--accent-foreground));
      --danger: hsl(var(--destructive));
      --danger-foreground: hsl(var(--destructive-foreground));
      --focus: hsl(var(--ring));
      --radius: .5rem;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      padding: 0;
      color: var(--text);
      background: var(--canvas);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }
    button, a, select, input { -webkit-tap-highlight-color: transparent; }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .app-page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--window);
    }

    .app-header {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .product-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .product-mark {
      width: 27px;
      height: 27px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 7px;
      background: var(--control-primary);
      color: var(--control-primary-foreground);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 750;
    }
    .product-title { min-width: 0; }
    .product-name { overflow: hidden; color: var(--text); font-size: 12px; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
    .product-section { margin-top: 1px; color: var(--text-faint); font-size: 10px; }
    .app-header-actions { display: flex; align-items: center; gap: 12px; }
    .header-version {
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: 10px;
    }

    .settings-shell {
      display: grid;
      flex: 1;
      grid-template-columns: 204px minmax(0, 1fr);
      min-height: 0;
    }

    .settings-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 16px 10px;
      border-right: 1px solid var(--line);
      background: hsl(var(--secondary));
    }

    .settings-nav-label {
      display: flex;
      align-items: center;
      height: 32px;
      padding: 0 10px;
      color: var(--text-faint);
      font-size: 11px;
      font-weight: 620;
    }

    .settings-nav-item {
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: calc(var(--radius) - 1px);
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 520;
    }

    .settings-nav-item[aria-current="page"] {
      border-color: hsl(var(--input));
      background: hsl(var(--background));
      color: var(--text);
      font-weight: 600;
    }

    .nav-icon { width: 16px; height: 16px; flex: 0 0 auto; }

    .market-workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .market-topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--line);
      background: hsl(var(--background));
    }

    .market-topbar-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .market-topbar-title h1 { margin: 0; font-size: 16px; font-weight: 620; letter-spacing: -.015em; }

    .settings-layout {
      display: grid;
      flex: 1;
      grid-template-columns: minmax(360px, .96fr) minmax(400px, 1.04fr);
      min-height: 0;
    }

    .catalog-pane,
    .detail-pane {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .catalog-pane { border-right: 1px solid var(--line); }

    .pane-head {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
    }

    .pane-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .pane-title {
      margin: 0;
      font-size: 15px;
      font-weight: 630;
      letter-spacing: -.012em;
    }

    .catalog-tabs {
      display: inline-flex;
      height: 36px;
      align-items: center;
      gap: 2px;
      margin: 0;
      padding: 3px;
      border-radius: var(--radius);
      background: hsl(var(--muted));
      color: var(--text-muted);
    }

    .catalog-tab {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border: 0;
      border-radius: calc(var(--radius) - 2px);
      background: transparent;
      color: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .catalog-tab[aria-selected="true"] { background: hsl(var(--background)); color: var(--text); box-shadow: 0 1px 2px hsl(240 10% 3.9% / .35); }
    .catalog-tab-count { color: var(--text-faint); font-family: var(--mono); font-size: 10px; }
    .catalog-tab[aria-selected="true"] .catalog-tab-count { color: var(--text-muted); }

    .source-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .state-dot { width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--success)); }
    .state-dot.stale { background: hsl(var(--warning)); }

    .toolbar { padding: 0; }

    .search-wrap { position: relative; }
    .search-icon {
      position: absolute;
      top: 50%;
      left: 11px;
      width: 16px;
      height: 16px;
      color: var(--text-faint);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-input,
    .select-control {
      width: 100%;
      height: 40px;
      border: 1px solid hsl(var(--input));
      border-radius: var(--radius);
      background: hsl(var(--background));
      color: var(--text);
      font-size: 14px;
    }

    .search-input { padding: 0 12px 0 37px; }
    .search-input::placeholder { color: var(--text-faint); }
    .search-input:hover, .select-control:hover { border-color: var(--surface-strong); }
    .search-input:focus, .select-control:focus { border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus), 0 0 0 4px var(--window); outline: none; }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .select-control { padding: 0 10px; }

    .catalog-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 39px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      color: var(--text-faint);
      font-size: 11px;
    }

    .result-list {
      flex: 1;
      overflow: auto;
      padding: 5px 10px 12px;
    }

    .result-item {
      width: 100%;
      display: block;
      padding: 12px 10px;
      border: 1px solid transparent;
      border-bottom-color: var(--line);
      border-radius: 7px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .result-item:hover { background: var(--surface); }
    .result-item[aria-selected="true"] { border-color: hsl(var(--input)); background: var(--accent-soft); }

    .rank-badge { flex: 0 0 auto; color: var(--text); font-family: var(--mono); font-size: 11px; }
    .result-content { min-width: 0; }

    .result-top,
    .result-bottom {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
    }

    .result-name { min-width: 0; flex: 1; overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .result-badges { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 4px; }
    .result-id { margin-top: 2px; overflow: hidden; color: var(--text-faint); font-family: var(--mono); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .result-description { display: -webkit-box; margin: 7px 0 9px; overflow: hidden; color: var(--text-muted); font-size: 11px; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .result-category { color: var(--text-faint); font-size: 10px; }
    .star-count { display: inline-flex; align-items: center; gap: 3px; color: var(--text-muted); font-family: var(--mono); font-size: 10px; }
    .star-glyph { color: hsl(var(--warning)); font-family: var(--sans); font-size: 11px; }
    .result-updated { margin-left: auto; }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 9px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.secondary { background: var(--surface); color: var(--text); }
    .badge.outline { border-color: hsl(var(--input)); color: var(--text-muted); }
    .badge.installed { border-color: hsl(var(--success) / .55); color: hsl(var(--success)); background: hsl(var(--success) / .12); }
    .badge.update { border-color: hsl(var(--warning) / .55); color: hsl(var(--warning)); background: hsl(var(--warning) / .12); }
    .badge.available { color: var(--text-faint); }

    .empty-list { padding: 46px 20px; color: var(--text-muted); text-align: center; }
    .empty-list p { margin: 0 0 14px; }

    .detail-pane { background: hsl(var(--background)); }
    .detail-body { flex: 1; overflow: auto; padding: 22px 24px; }

    .detail-eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--text-faint); font-size: 10px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .detail-heading { margin: 0; font-size: 18px; font-weight: 640; letter-spacing: -.022em; }
    .detail-id { margin: 4px 0 17px; color: var(--text-faint); font-family: var(--mono); font-size: 11px; }
    .detail-description { margin: 0; color: var(--text-muted); font-size: 13px; line-height: 1.65; }

    .detail-section { margin-top: 22px; }
    .section-label { margin: 0 0 8px; color: var(--text-faint); font-size: 10px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 3px 7px; border-radius: 5px; background: var(--surface); color: var(--text-muted); font-size: 11px; }

    .detail-list { margin: 0; border-top: 1px solid var(--line); }
    .detail-list > div { display: grid; grid-template-columns: 94px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .detail-list dt { color: var(--text-faint); font-size: 11px; }
    .detail-list dd { min-width: 0; margin: 0; color: var(--text-muted); font-size: 11px; overflow-wrap: anywhere; }
    .detail-list a { color: hsl(var(--primary)); text-decoration: none; }
    .detail-list a:hover { color: var(--text); text-decoration: underline; }
    .mono { font-family: var(--mono); }

    .risk-note {
      margin-top: 20px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .risk-note strong { color: var(--text); font-weight: 600; }

    .operation-panel {
      margin-top: 18px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
    }

    .operation-panel.confirm-install { border-color: hsl(var(--ring)); }
    .operation-panel.confirm-remove { border-color: hsl(var(--destructive)); }
    .operation-heading { margin: 0; color: var(--text); font-size: 12px; font-weight: 620; }
    .operation-copy { margin: 5px 0 0; color: var(--text-muted); font-size: 11px; line-height: 1.55; }
    .command-preview { display: block; margin-top: 10px; padding: 8px 9px; overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: hsl(var(--background)); color: var(--text-muted); font-family: var(--mono); font-size: 10px; white-space: nowrap; }

    .action-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

    .button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .button.default { background: var(--control-primary); color: var(--control-primary-foreground); }
    .button.default:hover { background: hsl(var(--primary) / .9); }
    .button.outline { border-color: hsl(var(--input)); background: hsl(var(--background)); }
    .button.outline:hover { background: var(--accent-soft); color: var(--accent-soft-foreground); }
    .button.destructive { background: var(--danger); color: var(--danger-foreground); }
    .button.destructive:hover { background: hsl(var(--destructive) / .9); }
    .button.ghost { color: var(--text-muted); }
    .button.ghost:hover { background: var(--accent-soft); color: var(--accent-soft-foreground); }
    .button.sm { min-height: 36px; padding: 0 12px; font-size: 12px; }
    .button.xs { min-height: 28px; padding: 0 8px; font-size: 12px; }
    .button:disabled { opacity: .55; cursor: wait; }

    .operation-running { display: flex; align-items: center; gap: 9px; margin-top: 12px; color: var(--text-muted); font-size: 11px; }
    .progress-track { width: 100%; height: 4px; overflow: hidden; border-radius: 3px; background: var(--surface-strong); }
    .progress-value { width: 62%; height: 100%; border-radius: inherit; background: var(--control-primary); animation: progress-slide 1.1s ease-in-out infinite alternate; }
    @keyframes progress-slide { from { transform: translateX(-25%); } to { transform: translateX(55%); } }

    .detail-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 12px 24px;
      border-top: 1px solid var(--line);
      background: var(--window);
    }

    .profile-line { color: var(--text-muted); font-size: 11px; }
    .profile-line strong { color: var(--text); font-family: var(--mono); font-weight: 550; }

    .refresh-status {
      min-height: 21px;
      margin: 0;
      padding: 7px 22px;
      border-top: 1px solid var(--line);
      color: var(--text-faint);
      font-size: 11px;
    }

    .refresh-status [role="status"] { color: var(--text-muted); }

    @media (max-width: 1040px) {
      .settings-layout { grid-template-columns: 1fr; }
      .detail-pane { border-top: 1px solid var(--line); }
      .catalog-pane { border-right: 0; }
    }

    @media (max-width: 620px) {
      .app-header { padding: 0 14px; }
      .header-version { display: none; }
      .settings-shell { grid-template-columns: 1fr; }
      .settings-nav {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .settings-nav-label { width: auto; height: 32px; padding: 0; }
      .settings-nav-item { min-height: 32px; }
      .market-topbar { align-items: flex-start; flex-direction: column; gap: 8px; padding: 12px 14px; }
      .settings-layout { grid-template-columns: 1fr; }
      .catalog-pane { border-bottom: 1px solid var(--line); }
      .detail-pane { min-height: 510px; }
      .detail-list > div { grid-template-columns: 82px minmax(0, 1fr); }
      .refresh-status { padding: 0 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app-page" aria-label="deepseek-harness-launcher 全屏设置页原型">
    <header class="app-header">
      <div class="product-id">
        <span class="product-mark" aria-hidden="true">DSH</span>
        <div class="product-title">
          <div class="product-name">deepseek-harness-launcher</div>
          <div class="product-section">设置 · 插件市场</div>
        </div>
      </div>
      <div class="app-header-actions">
        <span class="header-version">dsh 0.1.0-rc.6</span>
        <button class="button outline sm" id="return-to-dsh" type="button" aria-label="返回正在运行的 dsh">← 返回 dsh</button>
      </div>
    </header>

    <div class="settings-shell">
      <nav class="settings-nav" aria-label="设置导航">
        <div class="settings-nav-label">设置</div>
        <div class="settings-nav-item" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.64 5.64l2.12 2.12M16.24 16.24l2.12 2.12M18.36 5.64l-2.12 2.12M7.76 16.24l-2.12 2.12"/><circle cx="12" cy="12" r="4"/></svg>
          <span>插件</span>
        </div>
      </nav>

      <div class="market-workspace">
        <section class="market-topbar" aria-labelledby="market-page-title">
          <div class="market-topbar-title">
            <h1 id="market-page-title">插件市场</h1>
            <span class="source-state" id="source-state"><span class="state-dot"></span><span id="source-text">目录已同步</span></span>
          </div>
          <div class="catalog-tabs" role="tablist" aria-label="插件范围">
            <button class="catalog-tab" id="market-tab" type="button" role="tab" aria-controls="result-list" aria-selected="true" data-market-tab="market">市场</button>
            <button class="catalog-tab" id="installed-tab" type="button" role="tab" aria-controls="result-list" aria-selected="false" data-market-tab="installed">已安装 <span class="catalog-tab-count" id="installed-count">1</span></button>
          </div>
        </section>

        <div class="settings-layout">
      <section class="catalog-pane" aria-labelledby="market-page-title">
        <header class="pane-head">
          <div class="toolbar">
            <div class="search-wrap">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.35-4.35"/></svg>
              <input class="search-input" id="search" type="search" autocomplete="off" placeholder="搜索名称、仓库或能力" aria-label="搜索插件">
            </div>
            <div class="filter-row">
              <select class="select-control" id="category" aria-label="按分类筛选">
                <option value="all">全部分类</option>
                <option value="界面增强">界面增强</option>
                <option value="开发工具">开发工具</option>
                <option value="记忆">记忆</option>
                <option value="自动化">自动化</option>
              </select>
              <select class="select-control" id="sort" aria-label="排序方式">
                <option value="rank">市场排名</option>
                <option value="relevance">相关性</option>
                <option value="stars">GitHub Stars</option>
                <option value="updated">最近更新</option>
              </select>
            </div>
            <div class="filter-row">
              <select class="select-control" id="rank-filter" aria-label="榜单范围">
                <option value="all">全部排名</option>
                <option value="top100">Top 100</option>
                <option value="top500">Top 500</option>
              </select>
              <select class="select-control" id="stars-filter" aria-label="GitHub Stars 门槛">
                <option value="all">不限 Stars</option>
                <option value="100">100+ Stars</option>
                <option value="250">250+ Stars</option>
              </select>
            </div>
          </div>
        </header>
        <div class="catalog-meta">
          <span id="result-count">6 个插件</span>
          <button class="button ghost xs" id="clear-filters" type="button">清除筛选</button>
        </div>
        <div class="result-list" id="result-list" role="listbox" aria-label="插件结果"></div>
      </section>

      <section class="detail-pane" aria-labelledby="detail-title">
        <div class="detail-body" id="detail-body"></div>
        <footer class="detail-footer">
          <span class="profile-line">目标 profile：<strong id="profile-label">web</strong></span>
          <div class="action-row" id="primary-actions"></div>
        </footer>
      </section>
        </div>
        <p class="refresh-status"><span role="status" aria-live="polite" id="live-status">这是全屏设置页原型。目录来自受控 API，安装操作只由 Launcher 构造固定的 dsh 插件 spec。</span></p>
      </div>
    </div>
  </main>

  <script>
    const plugins = [
      {
        id: 'Han-1413141/dsh-cost-meter',
        name: 'dsh-cost-meter',
        description: '会话与当日 API 费用统计、预算图框、账户余额和历史看板，支持按模型查看费用。',
        category: '界面增强',
        tags: ['费用', '用量', 'Web UI'],
        updated: '2026-08-15',
        stars: 312,
        rank: 8,
        installed: true,
        ref: 'main',
        validated: '2026-08-16 14:30',
        subdir: ''
      },
      {
        id: 'omdsh-dev/dsh-at-file',
        name: 'dsh-at-file',
        description: '在输入框中搜索并引用工作区文件，提供接近编辑器的 @file 文件选择体验。',
        category: '开发工具',
        tags: ['文件', '工作区', '输入'],
        updated: '2026-08-14',
        stars: 184,
        rank: 17,
        installed: false,
        ref: 'main',
        validated: '2026-08-16 14:30',
        subdir: ''
      },
      {
        id: 'LeemanCheung/dsh-task-dag',
        name: 'dsh-task-dag',
        description: '把会话子代理和持久工作流展示为实时 DAG，支持查看状态、跳转节点和历史恢复。',
        category: '自动化',
        tags: ['子代理', '工作流', '可视化'],
        updated: '2026-08-12',
        stars: 96,
        rank: 47,
        installed: false,
        ref: 'v0.5.1',
        validated: '2026-08-16 14:30',
        subdir: ''
      },
      {
        id: 'omdsh-dev/dsh-genui',
        name: 'dsh-genui',
        description: '在助手回复中渲染交互式组件，支持图表、表单、Mermaid 与事件回传。',
        category: '界面增强',
        tags: ['组件', '图表', '生成式 UI'],
        updated: '2026-08-10',
        stars: 271,
        rank: 12,
        installed: false,
        ref: 'main',
        validated: '2026-08-16 14:30',
        subdir: ''
      },
      {
        id: 'a903067276-rgb/dsh-hud',
        name: 'dsh-hud',
        description: '在悬浮侧栏查看 Git 状态、MCP 服务器、技能、模型与 token 用量。',
        category: '开发工具',
        tags: ['Git', 'MCP', '状态'],
        updated: '2026-08-09',
        stars: 143,
        rank: 35,
        installed: false,
        ref: 'main',
        validated: '2026-08-16 14:30',
        subdir: ''
      },
      {
        id: 'nonewind/dsh-spend',
        name: 'dsh-spend',
        description: '按模型、日期和会话聚合用量与费用，提供紧凑的运行时费用视图。',
        category: '界面增强',
        tags: ['费用', '统计'],
        updated: '2026-08-06',
        stars: 74,
        rank: 128,
        installed: false,
        ref: 'main',
        validated: null,
        subdir: ''
      }
    ];

    const state = {
      selectedId: plugins[0].id,
      phase: 'idle',
      tab: 'market',
      refreshedAt: '今天 14:30',
      isRefreshing: false
    };

    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    const selectedPlugin = () => plugins.find((plugin) => plugin.id === state.selectedId);
    const repositoryUrl = (plugin) => `https://github.com/${plugin.id.split('/').slice(0, 2).join('/')}`;
    const installSpec = (plugin) => `github:${plugin.id.split('/').slice(0, 2).join('/')}${plugin.subdir ? `#path:${plugin.subdir}` : ''}`;

    function getFilteredPlugins() {
      const query = $('#search').value.trim().toLocaleLowerCase();
      const category = $('#category').value;
      const rankFilter = $('#rank-filter').value;
      const starsFilter = Number($('#stars-filter').value);
      const sort = $('#sort').value;
      const filtered = plugins.filter((plugin) => {
        const searchable = [plugin.name, plugin.id, plugin.description, plugin.category, ...plugin.tags].join(' ').toLocaleLowerCase();
        const rankLimit = rankFilter === 'top100' ? 100 : rankFilter === 'top500' ? 500 : null;
        return (!query || searchable.includes(query))
          && (category === 'all' || plugin.category === category)
          && (state.tab !== 'installed' || plugin.installed)
          && (!rankLimit || (plugin.rank !== null && plugin.rank <= rankLimit))
          && (!starsFilter || plugin.stars >= starsFilter);
      });

      return filtered.sort((left, right) => {
        if (sort === 'rank') return (left.rank ?? Number.POSITIVE_INFINITY) - (right.rank ?? Number.POSITIVE_INFINITY);
        if (sort === 'stars') return right.stars - left.stars;
        if (sort === 'updated') return right.updated.localeCompare(left.updated);
        if (query) {
          const leftScore = `${left.name} ${left.id}`.toLocaleLowerCase().startsWith(query) ? 1 : 0;
          const rightScore = `${right.name} ${right.id}`.toLocaleLowerCase().startsWith(query) ? 1 : 0;
          return rightScore - leftScore || (left.rank ?? Number.POSITIVE_INFINITY) - (right.rank ?? Number.POSITIVE_INFINITY);
        }
        return (left.rank ?? Number.POSITIVE_INFINITY) - (right.rank ?? Number.POSITIVE_INFINITY);
      });
    }

    function badgeFor(plugin) {
      if (plugin.installed) return '<span class="badge secondary installed">已安装</span>';
      return '<span class="badge outline available">可安装</span>';
    }

    function rankMark(plugin) {
      if (plugin.rank === null) return '<span class="badge outline rank-badge">未上榜</span>';
      return `<span class="badge outline rank-badge" aria-label="市场排名第 ${plugin.rank} 名">#${plugin.rank}</span>`;
    }

    function renderResults() {
      const results = getFilteredPlugins();
      $('#result-count').textContent = state.tab === 'installed' ? `${results.length} 个已安装插件` : `${results.length} 个插件`;
      const list = $('#result-list');
      if (!results.some((plugin) => plugin.id === state.selectedId)) {
        state.selectedId = results[0]?.id || null;
        state.phase = 'idle';
      }

      if (!results.length) {
        const emptyCopy = state.tab === 'installed' ? '当前 web profile 没有已安装插件。' : '没有匹配的插件。';
        list.innerHTML = `<div class="empty-list"><p>${emptyCopy}</p><button class="button outline sm" id="empty-clear" type="button">清除筛选</button></div>`;
        return;
      }

        list.innerHTML = results.map((plugin) => `
        <button class="result-item" type="button" role="option" aria-selected="${plugin.id === state.selectedId}" data-plugin-id="${escapeHtml(plugin.id)}">
          <span class="result-content">
            <span class="result-top">${rankMark(plugin)}<span class="result-name">${escapeHtml(plugin.name)}</span><span class="result-badges">${badgeFor(plugin)}</span></span>
            <span class="result-id">${escapeHtml(plugin.id)}</span>
            <span class="result-description">${escapeHtml(plugin.description)}</span>
            <span class="result-bottom"><span class="result-category">${escapeHtml(plugin.category)}</span><span class="star-count" aria-label="GitHub Stars ${plugin.stars.toLocaleString()}"><span class="star-glyph" aria-hidden="true">★</span>${plugin.stars.toLocaleString()} Stars</span><span class="result-category result-updated">更新于 ${escapeHtml(plugin.updated)}</span></span>
          </span>
        </button>
      `).join('');
    }

    function renderOperation(plugin) {
      const spec = escapeHtml(installSpec(plugin));
      if (state.phase === 'confirm-install') {
        return `
          <section class="operation-panel confirm-install" aria-label="确认安装">
            <p class="operation-heading">确认安装到 <span class="mono">web</span></p>
            <p class="operation-copy">Launcher 只会使用下方的固定来源，不会执行目录返回的展示命令。</p>
            <code class="command-preview">dsh plugin --profile web add ${spec}</code>
            <div class="action-row"><button class="button outline" type="button" data-action="cancel">取消</button><button class="button default" type="button" data-action="confirm-install">确认安装</button></div>
          </section>`;
      }
      if (state.phase === 'confirm-remove') {
        return `
          <section class="operation-panel confirm-remove" aria-label="确认卸载">
            <p class="operation-heading">从 <span class="mono">web</span> 移除插件</p>
            <p class="operation-copy">这会使用本地 profile 中已解析的安装 spec。不会影响其他 profile。</p>
            <code class="command-preview">dsh plugin --profile web remove ${spec}</code>
            <div class="action-row"><button class="button outline" type="button" data-action="cancel">取消</button><button class="button destructive" type="button" data-action="confirm-remove">确认卸载</button></div>
          </section>`;
      }
      if (state.phase === 'installing' || state.phase === 'removing') {
        const action = state.phase === 'installing' ? '正在安装并核验 profile' : '正在卸载并核验 profile';
        return `
          <section class="operation-panel" aria-label="正在处理">
            <p class="operation-heading">${action}</p>
            <div class="operation-running"><span class="progress-track"><span class="progress-value"></span></span><span>请稍候</span></div>
          </section>`;
      }
      return '';
    }

    function renderDetail() {
      const plugin = selectedPlugin();
      const body = $('#detail-body');
      const actions = $('#primary-actions');
      if (!plugin) {
        body.innerHTML = '<div class="empty-list"><p>选择一个插件以查看详情。</p></div>';
        actions.innerHTML = '';
        return;
      }

      const validated = plugin.validated ? escapeHtml(plugin.validated) : '目录未提供';
      body.innerHTML = `
        <div class="detail-eyebrow">${badgeFor(plugin)} <span>${escapeHtml(plugin.category)}</span></div>
        <h2 class="detail-heading" id="detail-title">${escapeHtml(plugin.name)}</h2>
        <p class="detail-id">${escapeHtml(plugin.id)}</p>
        <p class="detail-description">${escapeHtml(plugin.description)}</p>
        <section class="detail-section">
          <p class="section-label">标签</p>
          <div class="tag-row">${plugin.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}</div>
        </section>
        <section class="detail-section">
          <p class="section-label">来源与目录信息</p>
          <dl class="detail-list">
            <div><dt>GitHub 仓库</dt><dd><a href="${escapeHtml(repositoryUrl(plugin))}" target="_blank" rel="noreferrer">${escapeHtml(repositoryUrl(plugin).replace('https://github.com/', 'github.com/'))}</a></dd></div>
            <div><dt>安装来源</dt><dd class="mono">${escapeHtml(installSpec(plugin))}</dd></div>
            <div><dt>目录更新</dt><dd>${escapeHtml(plugin.updated)}</dd></div>
            <div><dt>结构校验</dt><dd>${validated}</dd></div>
            <div><dt>市场排名</dt><dd>${plugin.rank === null ? '目录未提供' : `#${plugin.rank} · 随目录同步更新`}</dd></div>
            <div><dt>GitHub Stars</dt><dd>${plugin.stars.toLocaleString()} · 随目录同步更新</dd></div>
          </dl>
        </section>
        <aside class="risk-note"><strong>安装前请确认仓库来源。</strong> 目录校验插件结构，不代表代码安全。插件安装后可在 dsh 中执行其声明的能力。</aside>
        ${renderOperation(plugin)}
      `;

      if (state.phase === 'confirm-install' || state.phase === 'confirm-remove' || state.phase === 'installing' || state.phase === 'removing') {
        actions.innerHTML = '';
      } else if (plugin.installed) {
        actions.innerHTML = '<button class="button destructive" type="button" data-action="remove">卸载</button>';
      } else {
        actions.innerHTML = '<button class="button default" type="button" data-action="install">安装</button>';
      }
    }

    function render() {
      const installedCount = plugins.filter((plugin) => plugin.installed).length;
      $('#installed-count').textContent = String(installedCount);
      document.querySelectorAll('[data-market-tab]').forEach((tab) => {
        tab.setAttribute('aria-selected', String(tab.dataset.marketTab === state.tab));
      });
      renderResults();
      renderDetail();
      $('#profile-label').textContent = 'web';
      $('#source-text').textContent = `已同步 · ${state.refreshedAt}`;
    }

    function setStatus(message) {
      $('#live-status').textContent = message;
    }

    function clearFilters() {
      $('#search').value = '';
      $('#category').value = 'all';
      $('#sort').value = 'rank';
      $('#rank-filter').value = 'all';
      $('#stars-filter').value = 'all';
      state.phase = 'idle';
      render();
      setStatus('已清除筛选，正在显示目录中的全部插件。');
    }

    function completeOperation(kind) {
      const plugin = selectedPlugin();
      if (!plugin) return;
      plugin.installed = kind === 'install';
      state.phase = 'idle';
      render();
      setStatus(kind === 'install' ? `${plugin.name} 已安装到 web，并已完成 profile 核验。` : `${plugin.name} 已从 web 卸载，并已完成 profile 核验。`);
    }

    document.addEventListener('click', (event) => {
      if (event.target.closest('#return-to-dsh')) {
        setStatus('原型演示：这里会返回正在运行的 dsh Web UI，并保留当前插件市场的搜索与选中状态。');
        return;
      }

      const result = event.target.closest('[data-plugin-id]');
      if (result) {
        state.selectedId = result.dataset.pluginId;
        state.phase = 'idle';
        render();
        return;
      }

      const tab = event.target.closest('[data-market-tab]');
      if (tab) {
        state.tab = tab.dataset.marketTab;
        state.phase = 'idle';
        render();
        setStatus(state.tab === 'installed' ? '正在显示 web profile 的已安装插件。' : '正在显示市场目录。');
        return;
      }

      const action = event.target.closest('[data-action]')?.dataset.action;
      if (action === 'install') {
        state.phase = 'confirm-install';
        render();
        setStatus('请确认安装来源与目标 profile。');
      }
      if (action === 'remove') {
        state.phase = 'confirm-remove';
        render();
        setStatus('请确认卸载目标。');
      }
      if (action === 'cancel') {
        state.phase = 'idle';
        render();
        setStatus('已取消操作，未对 profile 做任何更改。');
      }
      if (action === 'confirm-install') {
        state.phase = 'installing';
        render();
        setStatus('正在通过 Launcher 托管的 dsh 安装插件。');
        window.setTimeout(() => completeOperation('install'), 1100);
      }
      if (action === 'confirm-remove') {
        state.phase = 'removing';
        render();
        setStatus('正在通过 Launcher 托管的 dsh 卸载插件。');
        window.setTimeout(() => completeOperation('remove'), 900);
      }
      if (event.target.closest('#clear-filters') || event.target.closest('#empty-clear')) clearFilters();
    });

    ['input', 'change'].forEach((eventName) => {
      $('#search').addEventListener(eventName, () => { state.phase = 'idle'; render(); });
      $('#category').addEventListener(eventName, () => { state.phase = 'idle'; render(); });
      $('#sort').addEventListener(eventName, () => { state.phase = 'idle'; render(); });
      $('#rank-filter').addEventListener(eventName, () => { state.phase = 'idle'; render(); });
      $('#stars-filter').addEventListener(eventName, () => { state.phase = 'idle'; render(); });
    });

    document.addEventListener('keydown', (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        $('#search').focus();
      }
      if (event.key === 'Escape' && state.phase !== 'idle') {
        state.phase = 'idle';
        render();
        setStatus('已取消操作，未对 profile 做任何更改。');
      }
    });

    render();
  </script>
</body>
</html>
