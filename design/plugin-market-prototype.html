<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Harness</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: hsl(240 10% 4%);
      --panel: hsl(240 10% 5.8%);
      --panel-raised: hsl(240 8% 8%);
      --panel-hover: hsl(240 7% 11%);
      --panel-active: hsl(240 7% 13%);
      --text: hsl(0 0% 96%);
      --text-muted: hsl(240 5% 64%);
      --text-faint: hsl(240 4% 46%);
      --line: hsl(240 5% 16%);
      --line-strong: hsl(240 4% 23%);
      --focus: hsl(0 0% 82%);
      --danger: hsl(0 66% 60%);
      --warning: hsl(38 80% 62%);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --radius: 9px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font: 13px/1.45 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button, a, input, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    button { color: inherit; }

    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .app-header {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .product-id,
    .tabs, .catalog-heading, .toolbar, .toolbar-actions, .detail-eyebrow,
    .detail-footer, .detail-actions, .card-heading, .card-meta, .card-action {
      display: flex;
      align-items: center;
    }
    .product-id { gap: 10px; min-width: 0; }
    .product-mark {
      width: 27px; height: 27px; display: grid; place-items: center;
      flex: 0 0 auto; border-radius: 7px; background: var(--text); color: var(--bg);
      font: 750 10px var(--mono);
    }
    .product-name { color: var(--text); font-size: 12px; font-weight: 620; }
    .product-section { margin-top: 1px; color: var(--text-faint); font-size: 10px; }
    .header-actions { display: flex; align-items: center; gap: 14px; }
    .header-version { color: var(--text-faint); font: 10px var(--mono); }
    .header-link { color: var(--text-muted); font-size: 11px; text-decoration: none; }
    .header-link:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }

    .settings-shell { display: grid; flex: 1; grid-template-columns: 204px minmax(0, 1fr); min-height: 0; }
    .settings-nav {
      display: flex; flex-direction: column; gap: 4px; padding: 16px 10px;
      border-right: 1px solid var(--line); background: var(--panel);
    }
    .nav-label { height: 32px; display: flex; align-items: center; padding: 0 10px; color: var(--text-faint); font-size: 11px; font-weight: 620; }
    .nav-item {
      min-height: 36px; display: flex; align-items: center; gap: 9px; padding: 0 10px;
      border: 1px solid transparent; border-radius: 7px; background: transparent;
      color: var(--text-muted); cursor: pointer; font-size: 13px; text-align: left;
    }
    .nav-item:hover { background: var(--panel-hover); color: var(--text); }
    .nav-item[aria-current="page"] { border-color: var(--line-strong); background: var(--bg); color: var(--text); font-weight: 600; }
    .nav-back { margin-bottom: 10px; }
    .nav-icon { width: 16px; color: var(--text-muted); text-align: center; }

    .market-workspace { min-width: 0; display: flex; flex-direction: column; }
    .market-topbar { padding: 0 26px; border-bottom: 1px solid var(--line); background: var(--bg); }

    .tabs { gap: 4px; margin-top: 0; }
    .tab {
      min-height: 39px; padding: 7px 12px; border: 0; border-bottom: 2px solid transparent;
      background: transparent; color: var(--text-muted); cursor: pointer; font-size: 12px;
    }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { border-bottom-color: var(--text); color: var(--text); font-weight: 650; }
    .tab-count { margin-left: 4px; color: var(--text-faint); font: 10px var(--mono); }

    .market-layout { display: grid; flex: 1; grid-template-columns: minmax(400px, .98fr) minmax(420px, 1.02fr); min-height: 0; overflow: hidden; }
    .catalog-pane, .detail-pane { min-width: 0; display: flex; flex-direction: column; }
    .catalog-pane { border-right: 1px solid var(--line); }
    .catalog-head { padding: 20px 22px 15px; border-bottom: 1px solid var(--line); }
    .catalog-heading { justify-content: space-between; gap: 12px; margin-bottom: 14px; align-items: center; }
    .directory-source { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--text-muted); font-size: 11px; }
    .directory-status { color: var(--text); font-weight: 620; white-space: nowrap; }
    .directory-link { display: inline-flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; color: var(--text-muted); text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
    .directory-link:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    .external { color: var(--text-faint); font-size: 12px; }

    .search-wrap { position: relative; }
    .search-icon { position: absolute; top: 50%; left: 12px; color: var(--text-muted); transform: translateY(-50%); pointer-events: none; }
    .search-input {
      width: 100%; height: 40px; padding: 0 60px 0 38px; border: 1px solid var(--line-strong);
      border-radius: 9px; background: hsl(240 7% 8% / .8); color: var(--text); font-size: 13px;
    }
    .search-input::placeholder { color: var(--text-faint); }
    .search-input:hover { border-color: hsl(240 4% 30%); }
    .search-input:focus { border-color: var(--focus); box-shadow: 0 0 0 2px hsl(0 0% 82% / .14); outline: none; }
    .shortcut { position: absolute; top: 50%; right: 10px; color: var(--text-faint); transform: translateY(-50%); font: 10px var(--mono); }

    .category-bar { display: flex; gap: 6px; margin-top: 14px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
    .category-chip {
      flex: 0 0 auto; min-height: 28px; padding: 5px 10px; border: 1px solid transparent;
      border-radius: 999px; background: transparent; color: var(--text-muted); cursor: pointer;
      font-size: 11px; white-space: nowrap;
    }
    .category-chip:hover { background: var(--panel-raised); color: var(--text); }
    .category-chip[aria-pressed="true"] { border-color: var(--line-strong); background: var(--panel-raised); color: var(--text); font-weight: 600; }

    .custom-install { margin-top: 10px; }
    .custom-toggle { min-height: 28px; display: inline-flex; align-items: center; gap: 5px; padding: 0 2px; border: 0; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 11px; }
    .custom-toggle:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    .custom-toggle .plus { color: var(--text-faint); font: 13px var(--mono); }
    .chevron { transition: transform 150ms ease; }
    .custom-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }
    .custom-content { margin-top: 7px; }
    .custom-content[hidden] { display: none; }
    .custom-form { display: flex; gap: 8px; }
    .custom-input { min-width: 0; flex: 1; height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--bg); color: var(--text); font: 10px var(--mono); }
    .custom-input::placeholder { color: var(--text-faint); }
    .custom-feedback { margin: 6px 0 0; color: var(--danger); font-size: 10px; }

    .toolbar { justify-content: space-between; gap: 12px; min-height: 45px; padding: 0 22px; border-bottom: 1px solid var(--line); color: var(--text-muted); font-size: 11px; }
    .result-count { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .result-count strong { color: var(--text); font-weight: 650; }
    .count-muted { overflow: hidden; color: var(--text-faint); text-overflow: ellipsis; white-space: nowrap; }
    .stale-label { color: var(--warning); }
    .toolbar-actions { gap: 6px; }
    .sort-select { height: 30px; min-width: 116px; padding: 0 8px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text-muted); font-size: 11px; }
    .sort-select:hover { border-color: var(--line-strong); background: var(--panel-raised); color: var(--text); }

    .result-list { flex: 1; overflow: auto; padding: 10px 12px 18px; outline: none; }
    .result-list:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
    .card {
      width: 100%; min-height: 132px; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 12px; padding: 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-raised);
      color: inherit; cursor: pointer; text-align: left; transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }
    .card + .card { margin-top: 8px; }
    .card:hover { border-color: var(--line-strong); background: var(--panel-hover); }
    .card:active { transform: translateY(1px); }
    .card[aria-selected="true"] { border-color: hsl(0 0% 72% / .55); background: var(--panel-active); box-shadow: 0 0 0 1px hsl(0 0% 80% / .1); }
    .card-icon { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--panel); color: var(--text); font-size: 13px; font-weight: 700; }
    .card-main { min-width: 0; }
    .card-heading { gap: 8px; min-width: 0; }
    .card-name { min-width: 0; overflow: hidden; color: var(--text); font-size: 14px; font-weight: 650; letter-spacing: -.01em; text-overflow: ellipsis; white-space: nowrap; }
    .badge { display: inline-flex; align-items: center; min-height: 21px; padding: 2px 7px; border: 1px solid transparent; border-radius: 999px; color: var(--text-muted); font-size: 10px; font-weight: 600; white-space: nowrap; }
    .badge.outline { border-color: var(--line-strong); }
    .badge.secondary { background: var(--panel); color: var(--text); }
    .badge.local { color: var(--text-muted); }
    .card-id { display: block; margin-top: 3px; overflow: hidden; color: var(--text-faint); font: 10px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .card-description { display: -webkit-box; margin-top: 9px; overflow: hidden; color: var(--text-muted); font-size: 12px; line-height: 1.5; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .card-meta { justify-content: space-between; flex-wrap: nowrap; gap: 12px; margin-top: 11px; color: var(--text-muted); font-size: 10px; }
    .card-meta-tags, .card-meta-facts { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .card-meta-tags { overflow: hidden; }
    .card-meta-facts { flex: 0 0 auto; }
    .meta-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 999px; background: var(--panel); white-space: nowrap; }
    .source-chip { font-family: var(--mono); color: var(--text); }
    .card-stars, .card-date { white-space: nowrap; }
    .card-action { align-self: center; gap: 2px; color: var(--text); font-size: 11px; font-weight: 600; white-space: nowrap; }
    .card-action.muted { color: var(--text-muted); }
    .empty { padding: 54px 20px; color: var(--text-muted); text-align: center; }
    .empty p { margin: 0 0 12px; }
    .skeletons { display: grid; gap: 8px; padding: 2px; }
    .skeleton { min-height: 132px; display: flex; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; }
    .skeleton-icon, .skeleton-line { background: var(--panel); animation: pulse 1.2s ease-in-out infinite alternate; }
    .skeleton-icon { width: 42px; height: 42px; flex: 0 0 auto; border-radius: 12px; }
    .skeleton-lines { flex: 1; padding-top: 2px; }
    .skeleton-line { height: 9px; margin-bottom: 10px; border-radius: 4px; }
    .skeleton-line.short { width: 38%; } .skeleton-line.medium { width: 78%; } .skeleton-line.long { width: 58%; }
    @keyframes pulse { from { opacity: .45; } to { opacity: .9; } }

    .detail-pane { background: var(--bg); }
    .detail-body { flex: 1; overflow: auto; padding: 25px 28px; }
    .detail-eyebrow { flex-wrap: wrap; gap: 7px; margin-bottom: 9px; color: var(--text-faint); font-size: 10px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .detail-heading { margin: 0; font-size: 21px; font-weight: 680; letter-spacing: -.03em; }
    .detail-id { margin: 5px 0 18px; color: var(--text-faint); font: 11px var(--mono); }
    .detail-description { max-width: 620px; margin: 0; color: var(--text-muted); font-size: 13px; line-height: 1.7; }
    .detail-section { margin-top: 25px; }
    .section-label { margin: 0 0 9px; color: var(--text-faint); font-size: 10px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 4px 8px; border-radius: 6px; background: var(--panel-raised); color: var(--text-muted); font-size: 11px; }
    .detail-list { margin: 0; border-top: 1px solid var(--line); }
    .detail-list > div { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .detail-list dt { color: var(--text-faint); font-size: 11px; }
    .detail-list dd { min-width: 0; margin: 0; overflow-wrap: anywhere; color: var(--text-muted); font-size: 11px; }
    .detail-list a { display: inline-flex; align-items: center; gap: 4px; color: var(--text); text-decoration: none; }
    .detail-list a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .mono { font-family: var(--mono); }
    .risk-note { margin-top: 22px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-raised); color: var(--text-muted); font-size: 11px; line-height: 1.65; }
    .risk-note strong { color: var(--text); font-weight: 620; }
    .operation-panel { margin-top: 19px; padding: 14px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--panel-raised); }
    .operation-panel.remove { border-color: hsl(0 66% 60% / .65); }
    .operation-heading { margin: 0; color: var(--text); font-size: 12px; font-weight: 650; }
    .operation-copy { margin: 5px 0 0; color: var(--text-muted); font-size: 11px; line-height: 1.6; }
    .command-preview { display: block; margin-top: 11px; padding: 9px 10px; overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text-muted); font: 10px var(--mono); white-space: nowrap; }
    .operation-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 12px; }
    .button { min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 13px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text); cursor: pointer; font-size: 12px; font-weight: 550; white-space: nowrap; }
    .button:hover { background: var(--panel-hover); }
    .button.default { background: var(--text); color: var(--bg); }
    .button.default:hover { background: hsl(0 0% 88%); }
    .button.outline { border-color: var(--line-strong); background: var(--bg); }
    .button.outline:hover { background: var(--panel-raised); }
    .button.destructive { background: var(--danger); color: hsl(0 0% 100%); }
    .button.destructive:hover { background: hsl(0 66% 54%); }
    .button.ghost { color: var(--text-muted); }
    .button.xs { min-height: 28px; padding: 0 8px; font-size: 11px; }
    .button.sm { min-height: 32px; padding: 0 10px; font-size: 11px; }
    .button:disabled { cursor: wait; opacity: .55; }
    .detail-empty { min-height: 260px; display: grid; place-items: center; color: var(--text-muted); font-size: 12px; }
    .detail-footer { justify-content: space-between; gap: 12px; min-height: 62px; padding: 12px 28px; border-top: 1px solid var(--line); background: var(--panel); }
    .profile-line { color: var(--text-muted); font-size: 11px; }
    .profile-line strong { color: var(--text); font: 550 11px var(--mono); }
    .status-line { margin-top: 14px; color: var(--text-muted); font-size: 11px; }
    .status-line strong { color: var(--text); }

    .toast { position: fixed; right: 22px; bottom: 20px; max-width: 340px; padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel-active); color: var(--text-muted); box-shadow: 0 8px 30px hsl(240 10% 2% / .4); font-size: 11px; opacity: 0; pointer-events: none; transform: translateY(6px); transition: opacity 150ms ease, transform 150ms ease; }
    .toast.is-visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 1040px) {
      .market-layout { grid-template-columns: minmax(350px, .9fr) minmax(370px, 1.1fr); }
    }
    @media (max-width: 860px) {
      .market-layout { grid-template-columns: 1fr; overflow: visible; }
      .detail-pane { border-top: 1px solid var(--line); }
      .catalog-pane { border-right: 0; }
      .detail-body { min-height: 500px; }
    }
    @media (max-width: 620px) {
      .settings-shell { grid-template-columns: 1fr; }
      .settings-nav { flex-direction: row; align-items: center; gap: 8px; padding: 8px 14px; border-right: 0; border-bottom: 1px solid var(--line); }
      .nav-label { width: auto; height: 32px; padding: 0; }
      .nav-item { min-height: 32px; }
      .market-topbar { padding: 0 14px; }
      .catalog-head { padding-inline: 14px; }
      .toolbar { padding-inline: 14px; }
      .result-list { padding-inline: 8px; }
      .card { grid-template-columns: 38px minmax(0, 1fr); padding: 13px; }
      .card-icon { width: 38px; height: 38px; }
      .card-action { display: none; }
      .card-meta { align-items: flex-start; flex-wrap: wrap; }
      .card-meta-facts { margin-left: auto; }
      .detail-body { padding: 22px 16px; }
      .detail-footer { padding-inline: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="settings-shell">
      <aside class="settings-nav" aria-label="设置导航">
        <button class="nav-item nav-back" type="button"><span class="nav-icon">←</span>返回 dsh</button>
        <div class="nav-label">设置</div>
        <button class="nav-item" type="button"><span class="nav-icon">⚙</span>设置</button>
        <button class="nav-item" type="button" aria-current="page"><span class="nav-icon">⊞</span>插件</button>
      </aside>

      <section class="market-workspace" aria-label="插件市场">
        <header class="market-topbar">
          <div class="tabs" role="tablist" aria-label="插件范围">
            <button class="tab" type="button" role="tab" aria-selected="true" data-tab="discover">发现</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-tab="installed">已安装 <span class="tab-count" id="installed-count">1</span></button>
          </div>
        </header>

        <div class="market-layout">
          <section class="catalog-pane" aria-label="插件目录">
            <header class="catalog-head">
              <div class="catalog-heading">
                <div class="directory-source" aria-label="目录来源">
                  <span class="directory-status">目录已同步</span>
                  <a class="directory-link" href="https://awesome-dsh-plugin.com/plugins.json" target="_blank" rel="noreferrer">
                    awesome-dsh-plugin.com <span class="external" aria-hidden="true">↗</span>
                  </a>
                </div>
                <button class="button ghost xs" id="refresh" type="button" aria-label="刷新目录">↻ 刷新</button>
              </div>
              <div class="search-wrap">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input class="search-input" id="search" type="search" placeholder="搜索名称、仓库或能力" aria-label="搜索插件">
                <kbd class="shortcut">⌘ K</kbd>
              </div>
              <div class="category-bar" id="category-bar" aria-label="插件分类"></div>
              <section class="custom-install" aria-labelledby="custom-title">
                <button class="custom-toggle" id="custom-toggle" type="button" aria-expanded="false" aria-controls="custom-content">
                  <span class="plus" aria-hidden="true">+</span><span id="custom-title">自定义安装</span><span class="chevron" aria-hidden="true">⌄</span>
                </button>
                <div class="custom-content" id="custom-content" hidden>
                  <form class="custom-form" id="custom-form">
                    <input class="custom-input" id="custom-command" type="text" placeholder="dsh plugin --profile web add <source>" aria-label="自定义插件安装命令" aria-describedby="custom-feedback">
                    <button class="button default sm" type="submit">继续</button>
                  </form>
                  <p class="custom-feedback" id="custom-feedback" role="status" aria-live="polite"></p>
                </div>
              </section>
            </header>
            <div class="toolbar">
              <div class="result-count"><strong id="result-count">6</strong><span>个结果</span><span class="stale-label" id="stale-label" hidden>可能已过期</span></div>
              <div class="toolbar-actions">
                <button class="button ghost xs" id="clear" type="button">清除</button>
                <select class="sort-select" id="sort" aria-label="排序"><option value="relevance">推荐</option><option value="updated">最近加入</option><option value="stars">GitHub Stars</option></select>
              </div>
            </div>
            <div class="result-list" id="result-list" role="listbox" aria-label="插件结果" tabindex="0"></div>
          </section>

          <section class="detail-pane" aria-labelledby="detail-title">
            <div class="detail-body" id="detail-body"></div>
            <footer class="detail-footer">
              <span class="profile-line">目标 profile：<strong>web</strong></span>
              <div class="detail-actions" id="detail-actions"></div>
            </footer>
          </section>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const plugins = [
      {
        id: 'omdsh-dev/dsh-at-file', name: 'dsh-at-file', category: '会话与消息', categoryId: 'conversation',
        description: '在输入框中搜索并引用工作区文件，提供接近编辑器的 @file 文件选择体验。',
        tags: ['文件', '工作区', '输入'], source: 'github:omdsh-dev/dsh-at-file', kind: 'github', stars: 184, added: '2026-08-14', installed: false
      },
      {
        id: 'Han-1413141/dsh-cost-meter', name: 'dsh-cost-meter', category: '用量与计费', categoryId: 'usage',
        description: '会话与当日 API 费用统计、预算图框、账户余额和历史看板，支持按模型查看费用。',
        tags: ['费用', '用量', 'Web UI'], source: 'github:Han-1413141/dsh-cost-meter', kind: 'github', stars: 312, added: '2026-08-15', installed: true
      },
      {
        id: 'omdsh-dev/dsh-genui', name: 'dsh-genui', category: '界面增强', categoryId: 'ui',
        description: '在助手回复中渲染交互式组件，支持图表、表单、Mermaid 与事件回传。',
        tags: ['组件', '图表', '生成式 UI'], source: 'npm:@dsh/dsh-genui', kind: 'npm', stars: 271, added: '2026-08-10', installed: false
      },
      {
        id: 'LeemanCheung/dsh-task-dag', name: 'dsh-task-dag', category: '自动化', categoryId: 'automation',
        description: '把会话子代理和持久工作流展示为实时 DAG，支持查看状态、跳转节点和历史恢复。',
        tags: ['子代理', '工作流', '可视化'], source: 'github:LeemanCheung/dsh-task-dag', kind: 'github', stars: 96, added: '2026-08-12', installed: false
      },
      {
        id: 'dsh-community/dsh-paper', name: 'dsh-paper', category: '主题与外观', categoryId: 'theme',
        description: '一套低对比度的纸张主题，减少长时间阅读和调试时的视觉干扰。',
        tags: ['主题', '低对比度'], source: 'npm:@dsh/theme-paper', kind: 'npm', stars: 128, added: '2026-08-08', installed: false
      },
      {
        id: 'dsh-community/dsh-nocturne', name: 'dsh-nocturne', category: '主题与外观', categoryId: 'theme',
        description: '为深色工作流准备的紧凑主题，保留清晰的代码、状态与消息层级。',
        tags: ['主题', '深色'], source: 'github:dsh-community/dsh-nocturne', kind: 'github', stars: null, added: '2026-08-06', installed: false
      }
    ];

    const categories = ['全部', '界面增强', '用量与计费', '主题与外观', '模型与账号接入', '会话与消息', '自动化', '开发工具'];
    const state = {
      tab: 'discover', category: '全部', search: '', sort: 'relevance', selectedId: 'omdsh-dev/dsh-at-file',
      pending: null, customOpen: false, customPreview: null, refreshing: false
    };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    const selectedPlugin = () => plugins.find((plugin) => plugin.id === state.selectedId) || null;
    const installedPlugins = () => plugins.filter((plugin) => plugin.installed);
    const statusBadge = (plugin) => plugin.installed ? '<span class="badge secondary">已安装</span>' : '<span class="badge outline">可安装</span>';
    const initials = (plugin) => plugin.name.split(/[-_\s]+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join('').toUpperCase() || 'D';
    const displayStars = (plugin) => plugin.stars === null ? 'Stars 未提供' : `${plugin.stars.toLocaleString()} Stars`;
    const repositoryUrl = (plugin) => plugin.source.startsWith('github:') ? `https://github.com/${plugin.source.slice(7).split('#')[0]}` : `https://github.com/${plugin.id.split('/').slice(0, 2).join('/')}`;

    function showToast(message) {
      const toast = $('#toast');
      toast.textContent = message;
      toast.classList.add('is-visible');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('is-visible'), 2200);
    }

    function getResults() {
      const needle = state.search.trim().toLocaleLowerCase();
      const results = plugins.filter((plugin) => {
        const matchesTab = state.tab === 'discover' ? true : plugin.installed;
        const searchable = [plugin.name, plugin.id, plugin.description, plugin.category, ...plugin.tags].join(' ').toLocaleLowerCase();
        return matchesTab
          && (!needle || searchable.includes(needle))
          && (state.category === '全部' || plugin.category === state.category);
      });
      return results.sort((left, right) => {
        if (state.sort === 'updated') return right.added.localeCompare(left.added);
        if (state.sort === 'stars') return (right.stars ?? -1) - (left.stars ?? -1);
        if (needle) {
          const leftStarts = `${left.name} ${left.id}`.toLocaleLowerCase().startsWith(needle) ? 1 : 0;
          const rightStarts = `${right.name} ${right.id}`.toLocaleLowerCase().startsWith(needle) ? 1 : 0;
          return rightStarts - leftStarts;
        }
        return 0;
      });
    }

    function renderCategories() {
      $('#category-bar').innerHTML = categories.map((category) => `<button class="category-chip" type="button" aria-pressed="${state.category === category}" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>`).join('');
    }

    function renderCards() {
      const results = getResults();
      if (!results.some((plugin) => plugin.id === state.selectedId)) state.selectedId = results[0]?.id || null;
      $('#result-count').textContent = String(results.length);
      const list = $('#result-list');
      if (!results.length) {
        list.innerHTML = `<div class="empty"><p>${state.tab === 'installed' ? '当前 web profile 没有已安装插件。' : '没有匹配的插件。'}</p><button class="button outline sm" type="button" data-action="clear">清除筛选</button></div>`;
        return;
      }
      list.innerHTML = results.map((plugin) => `
        <button class="card" type="button" role="option" aria-selected="${plugin.id === state.selectedId}" data-plugin-id="${escapeHtml(plugin.id)}">
          <span class="card-icon" aria-hidden="true">${escapeHtml(initials(plugin))}</span>
          <span class="card-main">
            <span class="card-heading"><span class="card-name">${escapeHtml(plugin.name)}</span>${statusBadge(plugin)}</span>
            <span class="card-id">${escapeHtml(plugin.id)}</span>
            <span class="card-description">${escapeHtml(plugin.description)}</span>
            <span class="card-meta">
              <span class="card-meta-tags"><span class="meta-chip">${escapeHtml(plugin.category)}</span><span class="meta-chip source-chip"># ${plugin.kind === 'npm' ? 'npm' : '源码'}</span></span>
              <span class="card-meta-facts"><span class="card-stars">${plugin.stars !== null ? '★ ' : ''}${escapeHtml(displayStars(plugin))}</span><span class="card-date">加入于 ${escapeHtml(plugin.added)}</span></span>
            </span>
          </span>
          <span class="card-action ${plugin.installed ? 'muted' : ''}">${plugin.installed ? '已安装' : plugin.source ? '查看' : '不可安装'} ›</span>
        </button>`).join('');
    }

    function operationMarkup(plugin) {
      if (!state.pending) return '';
      const remove = state.pending === 'remove';
      const custom = state.pending === 'custom';
      const source = custom ? state.customPreview.source : plugin.source;
      const title = custom ? '自定义来源，尚未执行' : remove ? '确认从 web profile 卸载' : '确认安装到 web profile';
      const copy = custom ? '此来源未经过市场目录校验。Launcher 会从解析后的字段重新构造 dsh 参数。' : remove ? '将使用本地 profile 中已解析的安装来源，不会影响其他 profile。' : 'Launcher 只会使用下方固定来源，不会执行目录返回的展示命令。';
      const command = remove ? `dsh plugin --profile web remove ${source}` : `dsh plugin --profile web add ${source}`;
      return `<section class="operation-panel ${remove ? 'remove' : ''}" aria-label="${escapeHtml(title)}"><p class="operation-heading">${escapeHtml(title)}</p><p class="operation-copy">${escapeHtml(copy)}</p><code class="command-preview">${escapeHtml(command)}</code><div class="operation-actions"><button class="button outline xs" type="button" data-action="cancel">取消</button><button class="button ${remove ? 'destructive' : 'default'} xs" type="button" data-action="confirm">${remove ? '确认卸载' : '确认安装'}</button></div></section>`;
    }

    function renderCustomDetail() {
      const custom = state.customPreview;
      $('#detail-body').innerHTML = `<div class="detail-eyebrow"><span class="badge outline">自定义来源</span><span>未经过目录校验</span></div><h2 class="detail-heading" id="detail-title">自定义安装</h2><p class="detail-id mono">${escapeHtml(custom.source)}</p><p class="detail-description">检查解析结果后确认安装。这个来源不会写入插件市场目录，也不会获得目录排序或策展校验信息。</p><section class="detail-section"><p class="section-label">解析结果</p><dl class="detail-list"><div><dt>目标 profile</dt><dd class="mono">${escapeHtml(custom.profile)}</dd></div><div><dt>安装来源</dt><dd class="mono">${escapeHtml(custom.source)}</dd></div><div><dt>执行者</dt><dd>Launcher 托管的 dsh 0.1.0-rc.6</dd></div></dl></section><aside class="risk-note"><strong>安装前请确认来源。</strong> 输入不会交给 shell，但来源不在当前目录中。</aside>${operationMarkup(null)}`;
      $('#detail-actions').innerHTML = '';
    }

    function renderDetail() {
      if (state.customPreview) return renderCustomDetail();
      const plugin = selectedPlugin();
      if (!plugin) {
        $('#detail-body').innerHTML = '<div class="detail-empty">选择一个插件以查看详情。</div>';
        $('#detail-actions').innerHTML = '';
        return;
      }
      const repo = repositoryUrl(plugin);
      $('#detail-body').innerHTML = `<div class="detail-eyebrow">${statusBadge(plugin)}<span>${escapeHtml(plugin.category)}</span></div><h2 class="detail-heading" id="detail-title">${escapeHtml(plugin.name)}</h2><p class="detail-id">${escapeHtml(plugin.id)}</p><p class="detail-description">${escapeHtml(plugin.description)}</p><section class="detail-section"><p class="section-label">标签</p><div class="tag-row">${plugin.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}</div></section><section class="detail-section"><p class="section-label">来源与目录信息</p><dl class="detail-list"><div><dt>GitHub 仓库</dt><dd><a href="${escapeHtml(repo)}" target="_blank" rel="noreferrer">${escapeHtml(repo.replace('https://', ''))} ↗</a></dd></div><div><dt>安装来源</dt><dd class="mono">${escapeHtml(plugin.source)}</dd></div><div><dt>分类</dt><dd>${escapeHtml(plugin.category)}</dd></div><div><dt>GitHub Stars</dt><dd>${escapeHtml(displayStars(plugin))}</dd></div><div><dt>加入目录</dt><dd>${escapeHtml(plugin.added)}</dd></div><div><dt>目录校验</dt><dd>2026-08-18 · registry source</dd></div></dl></section><aside class="risk-note"><strong>目录校验插件结构，不代表代码安全。</strong> 安装前请确认仓库来源；插件可在 dsh 中执行其声明的能力。</aside>${operationMarkup(plugin)}`;
      if (state.pending) {
        $('#detail-actions').innerHTML = '';
      } else if (plugin.installed) {
        $('#detail-actions').innerHTML = '<button class="button destructive xs" type="button" data-action="remove">卸载</button>';
      } else {
        $('#detail-actions').innerHTML = `<button class="button default xs" type="button" data-action="install" ${plugin.source ? '' : 'disabled'}>安装</button>`;
      }
    }

    function render() {
      $('#installed-count').textContent = String(installedPlugins().length);
      document.querySelectorAll('[data-tab]').forEach((tab) => tab.setAttribute('aria-selected', String(tab.dataset.tab === state.tab)));
      $('#sort').value = state.sort;
      $('#custom-content').hidden = !state.customOpen;
      $('#custom-toggle').setAttribute('aria-expanded', String(state.customOpen));
      renderCategories();
      renderCards();
      renderDetail();
    }

    function parseCustomCommand(command) {
      const match = command.trim().match(/^dsh\s+plugin\s+--profile\s+([A-Za-z0-9][A-Za-z0-9._-]{0,63})\s+add\s+([^\s]+)$/);
      if (!match) return { error: '请输入 dsh plugin --profile <profile> add <source>。' };
      if (match[1] !== 'web') return { error: `找不到 profile：${match[1]}。当前可用 profile 是 web。` };
      if (/['"`;$|&<>\u0000-\u001f]/.test(match[2])) return { error: '来源格式无效。source 必须是单个安全参数。' };
      return { profile: match[1], source: match[2] };
    }

    function handleCustomSubmit(event) {
      event.preventDefault();
      const result = parseCustomCommand($('#custom-command').value);
      const feedback = $('#custom-feedback');
      feedback.textContent = result.error || '';
      if (result.error) return;
      state.customPreview = result;
      state.pending = 'custom';
      render();
      showToast('已解析来源，请在详情区确认安装');
    }

    function refreshCatalog() {
      if (state.refreshing) return;
      state.refreshing = true;
      $('#refresh').disabled = true;
      $('#refresh').textContent = '↻ 刷新中';
      window.setTimeout(() => {
        state.refreshing = false;
        $('#refresh').disabled = false;
        $('#refresh').textContent = '↻ 刷新';
        showToast('目录刷新完成');
      }, 700);
    }

    document.addEventListener('click', (event) => {
      const target = event.target.closest('button, a');
      if (!target) return;
      if (target.dataset.tab) {
        state.tab = target.dataset.tab;
        state.pending = null;
        state.customPreview = null;
        render();
        return;
      }
      if (target.dataset.category) { state.category = target.dataset.category; render(); return; }
      if (target.dataset.pluginId) { state.selectedId = target.dataset.pluginId; state.pending = null; state.customPreview = null; render(); return; }
      if (target.id === 'refresh') { refreshCatalog(); return; }
      if (target.id === 'clear' || target.dataset.action === 'clear') { state.search = ''; state.category = '全部'; $('#search').value = ''; render(); return; }
      if (target.id === 'custom-toggle') { state.customOpen = !state.customOpen; render(); return; }
      if (target.dataset.action === 'install') { state.pending = 'install'; render(); return; }
      if (target.dataset.action === 'remove') { state.pending = 'remove'; render(); return; }
      if (target.dataset.action === 'cancel') { state.pending = null; render(); return; }
      if (target.dataset.action === 'confirm') {
        const plugin = selectedPlugin();
        const removing = state.pending === 'remove';
        if (state.pending === 'custom') { state.customPreview = null; state.pending = null; state.customOpen = false; showToast('自定义来源已安装并完成核验'); render(); return; }
        if (plugin) { plugin.installed = !removing; state.pending = null; showToast(removing ? '插件已从 web profile 移除' : '插件已安装并完成核验'); render(); }
        return;
      }
    });
    $('#search').addEventListener('input', (event) => { state.search = event.target.value; render(); });
    $('#sort').addEventListener('change', (event) => { state.sort = event.target.value; render(); });
    $('#custom-form').addEventListener('submit', handleCustomSubmit);
    $('#result-list').addEventListener('keydown', (event) => {
      if (!['ArrowDown', 'ArrowUp'].includes(event.key)) return;
      event.preventDefault();
      const results = getResults();
      const current = results.findIndex((plugin) => plugin.id === state.selectedId);
      const delta = event.key === 'ArrowDown' ? 1 : -1;
      state.selectedId = (results[current + delta] || results[delta > 0 ? 0 : results.length - 1])?.id || null;
      render();
    });
    window.addEventListener('keydown', (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); $('#search').focus(); }
    });
    render();
  </script>
</body>
</html>
